# Revisa la cola (planilla de Google, variable HOJA_COLA) y sube a su hora lo que toca. Ver README.md.
# Repo PRIVADO (2.000 min gratis al mes): sin reloj propio de GitHub. Lo despierta cron-job.org SOLO en las horas
# de publicación y 15 y 30 min después (por si reintenta): hoy 12:00 y 18:00 (hora de Chile) → 6 vueltas al día,
# ~180 vueltas al mes ≈ 200–250 min (meta: menos de 500). Si se agrega una hora de publicación, sumarla en cron-job.org.
# A mano: botón "Run workflow" (con "solo probar" no publica: muestra la cola y revisa las claves).
name: Publicar

on:
  workflow_dispatch:
    inputs:
      solo_probar:
        description: "Solo probar (no publica nada)"
        type: boolean
        default: true
      prueba_youtube:
        description: "Subir un video de 3 s PRIVADO a cada canal de YouTube (para ver que cada llave va a su canal)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write     # avisos cuando algo no sale

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ffmpeg (solo para la prueba de YouTube)
        if: ${{ inputs.prueba_youtube }}
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
      - name: Publicar lo que toca
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECRETOS: ${{ toJSON(secrets) }}   # cada página dice en paginas/*.json qué secreto usa
          HOJA_COLA: ${{ vars.HOJA_COLA }}
        run: python publicar.py ${{ inputs.prueba_youtube && '--prueba-youtube' || (inputs.solo_probar && '--prueba' || '') }}
